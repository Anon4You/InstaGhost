[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instaghost"
dynamic = ["version"]
description = "Advanced Instagram OSINT Tool - Gather intelligence from Instagram profiles"
readme = "README.md"
authors = [
    { name = "Alienkrishn [Anon4You]"}
]
license = { text = "MIT" }
keywords = ["instagram", "osint", "security", "hacking", "reconnaissance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "instagrapi>=2.0,<4",
    "requests>=2.25.1,<3",
]
requires-python = ">=3.8"

[project.urls]
"Homepage" = "https://github.com/Anon4You/InstaGhost"
"Bug Reports" = "https://github.com/Anon4You/InstaGhost/issues"

[project.scripts]
instaghost = "instaghost.cli:main"
instaghost-web = "instaghost.web:main"
instaghost-bot = "instaghost.telegram_bot:main"

[tool.setuptools.dynamic]
version = { attr = "instaghost.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
instaghost = ["webui/*.html", "webui/*.css", "webui/*.js", "webui/*.svg"]
