[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instaghost"
version = "1.0.0"
description = "Advanced Instagram OSINT Tool - Gather intelligence from Instagram profiles"
readme = "README.md"
authors = [
    { name = "Alienkrishn [Anon4You]"}
]
license = { text = "MIT" }
keywords = ["instagram", "osint", "security", "hacking", "reconnaissance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "instaloader>=4.9",
    "requests>=2.25.1",
]
requires-python = ">=3.7"

[project.urls]
"Homepage" = "https://github.com/Anon4You/InstaGhost"
"Bug Reports" = "https://github.com/Anon4You/InstaGhost/issues"

[project.scripts]
instaghost = "instaghost.cli:main"
